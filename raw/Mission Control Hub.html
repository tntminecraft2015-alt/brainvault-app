<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mission Control · Trainer Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="hub-a.jsx"></script>
<script type="text/babel" src="hub-b.jsx"></script>
<script type="text/babel" src="hub-c.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "green",
  "density": "cozy",
  "scanlines": 0.7,
  "glow": 0.2,
  "boot": true,
  "showStatus": true,
  "showSchedule": true,
  "showCalendar": true,
  "showTasks": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const modules = {
    status:   t.showStatus,
    schedule: t.showSchedule,
    calendar: t.showCalendar,
    tasks:    t.showTasks,
  };
  // Hub A keeps its 4-color GB look in "green"; in other themes it switches
  // to the matching CRT palette. Hub B & C theme directly.
  const themeA = t.theme === 'green' ? 'green' : t.theme;

  return (
    <>
      <DesignCanvas>
        <DCSection id="hubs" title="Mission Control · Hub variants"
          subtitle="3 takes on a trainer-themed schedule + calendar + quest log. Click a calendar day. Check off a quest. Watch the NOW marker tick.">
          <DCArtboard id="a" label="A · Pocket Trainer (handheld classic)" width={520} height={820}>
            <HubA
              theme={t.theme} density={t.density}
              scanlines={t.scanlines * 1.3} glow={t.glow}
              boot={t.boot} modules={modules}
            />
          </DCArtboard>
          <DCArtboard id="b" label="B · Field Console (dual-screen)" width={560} height={820}>
            <HubB
              theme={t.theme} density={t.density}
              scanlines={t.scanlines} glow={t.glow}
              boot={t.boot} modules={modules}
            />
          </DCArtboard>
          <DCArtboard id="c" label="C · Trainer HUD (modern bestiary)" width={1100} height={720}>
            <HubC
              theme={t.theme} density={t.density}
              scanlines={t.scanlines * 0.7} glow={t.glow * 0.7}
              boot={t.boot} modules={modules}
            />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakColor
            label="Palette"
            value={t.theme === 'green'   ? '#9bbc0f'
                 : t.theme === 'cyan'    ? '#7fdbff'
                 : t.theme === 'amber'   ? '#ffb000'
                 :                         '#ff77ee'}
            options={['#9bbc0f', '#7fdbff', '#ffb000', '#ff77ee']}
            onChange={(hex) => {
              const map = { '#9bbc0f': 'green', '#7fdbff': 'cyan', '#ffb000': 'amber', '#ff77ee': 'magenta' };
              setTweak('theme', map[hex.toLowerCase()] || 'cyan');
            }}
          />
        </TweakSection>

        <TweakSection label="Feel">
          <TweakRadio
            label="Density"
            value={t.density}
            options={['cozy', 'dense']}
            onChange={(v) => setTweak('density', v)}
          />
          <TweakSlider
            label="Scanlines"
            value={t.scanlines}
            min={0} max={1} step={0.05}
            onChange={(v) => setTweak('scanlines', v)}
          />
          <TweakSlider
            label="CRT glow"
            value={t.glow}
            min={0} max={1} step={0.05}
            onChange={(v) => setTweak('glow', v)}
          />
          <TweakToggle
            label="Boot animation"
            value={t.boot}
            onChange={(v) => setTweak('boot', v)}
          />
          <TweakButton
            label="↻ Replay boot sequence"
            secondary
            onClick={() => {
              // Toggle boot off then on to retrigger the useBoot effect in
              // every hub. setTimeout breaks them into separate state writes
              // so React commits the off-state before flipping back on.
              setTweak('boot', false);
              setTimeout(() => setTweak('boot', true), 50);
            }}
          />
        </TweakSection>

        <TweakSection label="Modules">
          <TweakToggle label="Trainer / status"   value={t.showStatus}   onChange={(v) => setTweak('showStatus', v)} />
          <TweakToggle label="Daily schedule"     value={t.showSchedule} onChange={(v) => setTweak('showSchedule', v)} />
          <TweakToggle label="Month calendar"     value={t.showCalendar} onChange={(v) => setTweak('showCalendar', v)} />
          <TweakToggle label="Quest log / to-dos" value={t.showTasks}    onChange={(v) => setTweak('showTasks', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
